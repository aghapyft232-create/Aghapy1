<!DOCTYPE html>
<html lang="ar" dir="rtl" class="w-full h-full overflow-hidden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Student Registration</title>
​<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
​<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
​<script src="https://cdn.tailwindcss.com"></script>
​<style>
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}
html, body {
margin: 0;
padding: 0;
width: 100vw;
height: 100vh;
height: 100dvh;
overflow: hidden;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.custom-scroll::-webkit-scrollbar {
width: 4px;
}
.custom-scroll::-webkit-scrollbar-thumb {
background: #cbd5e1;
border-radius: 4px;
}
</style>
</head>
<body class="w-full h-full flex flex-col justify-between m-0 p-0 antialiased">
​<!-- Header Section with Large Transparent Glass Icon -->
<header class="w-full pt-4 pb-2 px-6 text-center text-white shrink-0 select-none flex flex-col items-center">
<div class="w-32 h-32 rounded-3xl bg-white/5 backdrop-blur-md border border-white/10 shadow-2xl flex items-center justify-center mb-2 overflow-hidden p-2 ring-1 ring-white/10">
<img src="icon.png" alt="App Icon" class="w-full h-full object-cover rounded-2xl" onerror="this.src='https://placehold.co/120x120/667eea/ffffff?text=Logo'">
</div>
<h1 class="text-xl font-bold tracking-wide drop-shadow-md">Student Registration</h1>
<p class="text-[11px] text-purple-100 mt-0.5 opacity-90">يرجى إدخال بيانات الطالب بدقة</p>
</header>
​<main class="w-full flex-1 bg-white rounded-t-[32px] shadow-2xl px-6 py-5 flex flex-col justify-between overflow-y-auto custom-scroll">
<form class="space-y-3 w-full max-w-lg mx-auto flex-1 flex flex-col justify-between" onsubmit="event.preventDefault(); showCustomToast();">
​<div class="space-y-2.5">
<!-- Name Field -->
<div>
<label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
<input type="text" required placeholder="أدخل اسمك الكامل" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
</div>
​<!-- Email Field -->
<div>
<label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
<input type="email" required placeholder="example@domain.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
</div>
​<!-- Course & Gender Grid -->
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-xs font-semibold text-gray-700 mb-1">Course</label>
<select required class="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all text-gray-600">
<option value="">اختر الكورس...</option>
<option value="web">Web Development</option>
<option value="ui">UI/UX Design</option>
</select>
</div>
<div>
<label class="block text-xs font-semibold text-gray-700 mb-1">Gender</label>
<select required class="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all text-gray-600">
<option value="">اختر النوع...</option>
<option value="m">ذكر</option>
<option value="f">أنثى</option>
</select>
</div>
</div>
​<!-- Phone Field -->
<div>
<label class="block text-xs font-semibold text-gray-700 mb-1">Phone Number</label>
<input type="tel" required placeholder="رقم الهاتف" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
</div>
​<!-- Additional Info -->
<div>
<label class="block text-xs font-semibold text-gray-700 mb-1">Additional Information</label>
<textarea rows="2" placeholder="أي معلومات إضافية ..." class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all resize-none"></textarea>
</div>
</div>
​<!-- Submit Button -->
<button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg hover:opacity-95 active:scale-[0.98] transition-all text-sm tracking-wide mt-2 shrink-0">
Submit
</button>
</form>
​<footer class="text-center pt-2 pb-1 text-[11px] text-gray-400 shrink-0 select-none">
Secure Full Screen Mobile App
</footer>
</main>
​<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-medium shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50">
تم الحفظ بنجاح! ✨
</div>
​<script>
function showCustomToast() {
const toast = document.getElementById('toast');
toast.classList.remove('opacity-0', 'pointer-events-none');
toast.classList.add('opacity-100');
setTimeout(() => {
toast.classList.remove('opacity-100');
toast.classList.add('opacity-0', 'pointer-events-none');
}, 3000);
}
</script>
</body>
</html>
